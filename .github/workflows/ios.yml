name: iOS TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "TestFlight 업로드(Run workflow 전용 — push 자동 실행은 스모크 16항까지만)"
        default: "true"
concurrency: { group: ios-build, cancel-in-progress: true }
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_DISABLE_COLORS: "1"
      CI: "true"
      TEAM_ID: "885CWQ465B"
      APP_ID: "com.campusdoit.app"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      IOS_CERT_P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      APP_HDR_SECRET: ${{ secrets.APP_HDR_SECRET }}
      ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
      ADMOB_REWARDED_IOS: ${{ secrets.ADMOB_REWARDED_IOS }}
      ADMOB_BANNER_IOS: ${{ secrets.ADMOB_BANNER_IOS }}
      ADMOB_NATIVE_IOS: ${{ secrets.ADMOB_NATIVE_IOS }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inject app header secret (Turnstile 면제 헤더, 5번방 ⓐ)
        run: |
          set -euo pipefail
          test -n "$APP_HDR_SECRET" || { echo "APP_HDR_SECRET secret missing"; exit 1; }
          python3 - <<'PY'
          import os,io
          p='www/index.html'; s=io.open(p,encoding='utf-8').read()
          assert s.count('"__APP_HDR_SECRET__"')==1, 'placeholder count != 1'
          io.open(p,'w',encoding='utf-8').write(s.replace('"__APP_HDR_SECRET__"','"'+os.environ['APP_HDR_SECRET'].replace('\\','\\\\').replace('"','\\"')+'"'))
          print('secret injected')
          PY
      - name: Add & sync iOS
        run: |
          test -d ios || npx cap add ios
          npx cap sync ios
      - name: Native tab bar shell (plugin overlay) + splash assets
        run: |
          set -euo pipefail
          cp native/App/NativeTabsPlugin.swift native/App/CampusAdsPlugin.swift ios/App/App/
          gem install xcodeproj -N
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" } or abort("App target not found")
            group = proj.main_group.groups.find { |g| g.path == "App" || g.name == "App" } or abort("App group not found")
            ["NativeTabsPlugin.swift","CampusAdsPlugin.swift"].each do |f|
              unless group.files.any? { |x| x.path == f }
                ref = group.new_reference(f)
                target.source_build_phase.add_file_reference(ref, true)
              end
            end
            proj.save
          '
          ruby native/App/register_plugin.rb
          grep -c "NativeTabsPlugin.swift" ios/App/App.xcodeproj/project.pbxproj; grep -c "CampusAdsPlugin.swift" ios/App/App.xcodeproj/project.pbxproj
          grep -q "Google-Mobile-Ads-SDK" ios/App/Podfile || sed -i '' "s/^target 'App' do/target 'App' do\n  pod 'Google-Mobile-Ads-SDK', '~> 11.0'/" ios/App/Podfile
          grep -n "Google-Mobile-Ads-SDK" ios/App/Podfile
          # 백로그 ④: iOS 배포 타겟 15.0 (ITMS-90068 대응) — 앱 프로젝트·Podfile 일괄
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/" ios/App/Podfile
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 15.0" ios/App/App.xcodeproj/project.pbxproj; grep "platform :ios" ios/App/Podfile
          for f in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do cp resources/splash-2732x2732.png "ios/App/App/Assets.xcassets/Splash.imageset/$f"; done
          ls ios/App/App/Assets.xcassets/Splash.imageset/
      - name: App icon 1024 into Assets
        run: cp resources/AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Export compliance (exempt) into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UIUserInterfaceStyle" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIUserInterfaceStyle string Light" ios/App/App/Info.plist   # 5번방 09.21: 앱 라이트 전용(스플래시·상태바 포함)
          /usr/libexec/PlistBuddy -c "Print :UIUserInterfaceStyle" ios/App/App/Info.plist
          # ---- 광고 회차: AdMob (Secrets 없으면 구글 테스트 값) · ATT · SKAdNetwork · PrivacyInfo ----
          P=ios/App/App/Info.plist; PB=/usr/libexec/PlistBuddy
          for k in GADApplicationIdentifier ADMOB_REWARDED ADMOB_BANNER ADMOB_NATIVE NSUserTrackingUsageDescription SKAdNetworkItems; do $PB -c "Delete :$k" $P 2>/dev/null || true; done
          $PB -c "Add :GADApplicationIdentifier string ${ADMOB_APP_ID_IOS:-ca-app-pub-3940256099942544~1458002511}" $P
          $PB -c "Add :ADMOB_REWARDED string ${ADMOB_REWARDED_IOS:-ca-app-pub-3940256099942544/1712485313}" $P
          $PB -c "Add :ADMOB_BANNER string ${ADMOB_BANNER_IOS:-ca-app-pub-3940256099942544/2934735716}" $P
          $PB -c "Add :ADMOB_NATIVE string ${ADMOB_NATIVE_IOS:-ca-app-pub-3940256099942544/3986624511}" $P
          $PB -c "Add :NSUserTrackingUsageDescription string 맞춤 광고를 보여드리기 위해 사용해요. 허용하지 않아도 앱은 그대로 쓸 수 있어요." $P
          $PB -c "Add :SKAdNetworkItems array" $P
          i=0; for n in cstr6suwn9 4fzdc2evr5 2fnua5tm8w ydx93a7ass p78axxw29g v72qych5uu ludvb6z3bs cp8zw746q7 3sh42y64q3 c6k4g5qg8m s39g8k73mm 3qy4746246 hs6bdukanm mlmmfzh3r3 v4nxqhlyqp wzmmz9fp6w su67r6k2v3 yclnxrl5pm t38b2kh725 7ug5zh24hu gta9lk7p23 vutu7akeur y5ghdn5j9k v9wttpbfk9 n38lu8286q 47vhws6wlr kbd757ywx3 9t245vhmpl a2p9lx4jpn 22mmun2rn5 4468km3ulz 2u9pt9hc89 8s468mfl3y ppxm28t8ap uw77j35x4d pwa73g5rt2 578prtvx9j 4dzt52r2t5 tl55sbb4fm e5fvkxwrpn 8c4e2ghe7u 3rd42ekr43 3qcr597p9d; do $PB -c "Add :SKAdNetworkItems:$i dict" $P; $PB -c "Add :SKAdNetworkItems:$i:SKAdNetworkIdentifier string $n.skadnetwork" $P; i=$((i+1)); done
          $PB -c "Print :GADApplicationIdentifier" $P; echo "SKAdNetwork items: $i"
          cat > ios/App/App/PrivacyInfo.xcprivacy <<'XP'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>NSPrivacyTracking</key><true/>
            <key>NSPrivacyTrackingDomains</key><array/>
            <key>NSPrivacyCollectedDataTypes</key><array>
              <dict><key>NSPrivacyCollectedDataType</key><string>NSPrivacyCollectedDataTypeDeviceID</string><key>NSPrivacyCollectedDataTypeLinked</key><false/><key>NSPrivacyCollectedDataTypeTracking</key><true/><key>NSPrivacyCollectedDataTypePurposes</key><array><string>NSPrivacyCollectedDataTypePurposeThirdPartyAdvertising</string></array></dict>
              <dict><key>NSPrivacyCollectedDataType</key><string>NSPrivacyCollectedDataTypeAdvertisingData</string><key>NSPrivacyCollectedDataTypeLinked</key><false/><key>NSPrivacyCollectedDataTypeTracking</key><true/><key>NSPrivacyCollectedDataTypePurposes</key><array><string>NSPrivacyCollectedDataTypePurposeThirdPartyAdvertising</string></array></dict>
            </array>
            <key>NSPrivacyAccessedAPITypes</key><array>
              <dict><key>NSPrivacyAccessedAPIType</key><string>NSPrivacyAccessedAPICategoryUserDefaults</string><key>NSPrivacyAccessedAPITypeReasons</key><array><string>CA92.1</string></array></dict>
            </array>
          </dict></plist>
          XP
          ruby -e 'require "xcodeproj"; proj=Xcodeproj::Project.open("ios/App/App.xcodeproj"); t=proj.targets.find{|x|x.name=="App"}; g=proj.main_group.groups.find{|x|x.path=="App"||x.name=="App"}; f="PrivacyInfo.xcprivacy"; unless g.files.any?{|x|x.path==f}; r=g.new_reference(f); t.resources_build_phase.add_file_reference(r,true); end; proj.save'
          grep -c "PrivacyInfo.xcprivacy" ios/App/App.xcodeproj/project.pbxproj
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-cache-${{ hashFiles('ios/App/Podfile') }}
          restore-keys: cocoapods-cache-
      - name: pod install (Podfile.lock ↔ Manifest.lock 동기)
        run: |
          cd ios/App
          pod install --repo-update
          diff Podfile.lock Pods/Manifest.lock && echo "Pods in sync"
      - name: Simulator smoke (9-item shell acceptance)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);c=[x for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")];c.sort(key=lambda x:x["name"]);print(c[-1]["udid"])')
          echo "sim=$UDID"; echo "$UDID" > smoke_udid.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -5
          APP=$(find build/sim -name "App.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p smoke
          B=com.campusdoit.app
          cap(){ xcrun simctl io "$UDID" screenshot "smoke/$1.png"; }
          xcrun simctl ui "$UDID" appearance light
          # ① ② ⑦
          xcrun simctl launch "$UDID" $B -smokeTab home; sleep 0.3; cap 00_splash_1s
          sleep 1.3; cap 00_home_first   # 스플래시(1.2s) 걷힌 직후 ≈0.3s
          sleep 6.4; cap 01_home_8s; sleep 3; cap 01_home_15s
          xcrun simctl spawn "$UDID" launchctl list > smoke/launchctl.txt || true
          xcrun simctl terminate "$UDID" $B || true
          # ③ ④ ⑤ ⑥ — 라이트/다크 × 5탭 (상태 JSON은 앱 Documents에 기록)
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            for k in cat score home sched my; do
              xcrun simctl launch "$UDID" $B -smokeTab $k; sleep 9; cap "02_${mode}_$k"
              xcrun simctl terminate "$UDID" $B || true
            done
          done
          xcrun simctl ui "$UDID" appearance light
          # ⑨ 로그인 게이트: 점수진단 탭 → 88 입력 → 실행 → loginView
          xcrun simctl launch "$UDID" $B -smokeTab score -smokeAction runSim; sleep 12; cap 04_login_gate
          xcrun simctl terminate "$UDID" $B || true
          # ⑪ Turnstile: 가입 화면 진입 후 위젯 토큰(네트워크 허용 전제)
          xcrun simctl launch "$UDID" $B -smokeTab my -smokeAction openSignup; sleep 12; cap 06_signup_turnstile
          xcrun simctl terminate "$UDID" $B || true; sleep 1
          xcrun simctl launch "$UDID" $B -smokeTab score -smokeAction adsSmoke; sleep 14; cap 07_ads
          xcrun simctl terminate "$UDID" $B || true
          # ⑧ 오프라인: pf로 아웃바운드 차단 후 실행(번들 웹이라 홈 로드·탭바 기대)
          IF=$(route -n get 8.8.8.8 2>/dev/null | awk '/interface:/{print $2}'); echo "block on $IF"
          printf "block drop out quick on %s proto {tcp udp} from any to any\n" "$IF" | sudo pfctl -f - || true; sudo pfctl -e || true
          sudo pfctl -s rules || true
          xcrun simctl launch "$UDID" $B -smokeTab home; sleep 12; cap 05_offline_home
          xcrun simctl terminate "$UDID" $B || true
          sudo pfctl -d || true
          # 상태 JSON 수집
          DATA=$(xcrun simctl get_app_container "$UDID" $B data); cp "$DATA"/Documents/smoke_*.json smoke/ 2>/dev/null || true; ls smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke
          path: smoke/*
      - name: Smoke judge (9 items → Job Summary)
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, zlib, sys, glob, os, json
          def png_rgb(path):
              d=open(path,'rb').read(); pos=8; w=h=0; idat=b''
              while pos<len(d):
                  ln=struct.unpack('>I',d[pos:pos+4])[0]; t=d[pos+4:pos+8]; c=d[pos+8:pos+8+ln]; pos+=12+ln
                  if t==b'IHDR': w,h,bd,ct=struct.unpack('>IIBB',c[:10])
                  elif t==b'IDAT': idat+=c
                  elif t==b'IEND': break
              raw=zlib.decompress(idat); bpp=4 if ct==6 else 3; stride=w*bpp; out=bytearray(); prev=bytearray(stride); p=0
              for y in range(h):
                  f=raw[p]; p+=1; line=bytearray(raw[p:p+stride]); p+=stride
                  for i in range(stride):
                      a=line[i-bpp] if i>=bpp else 0; b=prev[i]; c=prev[i-bpp] if i>=bpp else 0
                      if f==1: line[i]=(line[i]+a)&255
                      elif f==2: line[i]=(line[i]+b)&255
                      elif f==3: line[i]=(line[i]+((a+b)>>1))&255
                      elif f==4:
                          pa=abs(b-c); pb=abs(a-c); pc=abs(a+b-2*c); pr=a if pa<=pb and pa<=pc else (b if pb<=pc else c); line[i]=(line[i]+pr)&255
                  out+=line; prev=line
              return w,h,bpp,bytes(out)
          def band(f):
              w,h,bpp,px=png_rgb(f); scale=3 if h>2400 else 2; y0=h-int(80*scale); y1=h-int(24*scale); cob=n=lum=0
              for y in range(y0,y1):
                  row=y*w*bpp
                  for x in range(0,w,3):
                      r,g,b=px[row+x*bpp],px[row+x*bpp+1],px[row+x*bpp+2]; n+=1; lum+=(r*299+g*587+b*114)//1000
                      if b>r+50 and b>g+30 and b>80: cob+=1
              return cob,lum//max(n,1)
          S=lambda n: f'smoke/{n}.png'; R=[]
          def item(no,name,ok,detail): R.append((no,name,ok,detail))
          try: hj=json.load(open('smoke/smoke_home.json')); sh=hj.get('splashHideAt',-1); rv=hj.get('revealAt',-1)
          except Exception: sh=rv=-1
          c,l=band(S('00_splash_1s')); item(1,'스플래시 중 탭바 미노출(표시 시각 ≥ 스플래시 종료 시각)', sh>0 and rv>=sh, f'splashHide={sh}s reveal={rv}s (0.3s 캡처 cobalt={c}, 캡처 지연 ~1s라 참고값)')
          cf,_=band(S('00_home_first')); item(1.5,'홈 등장 직후 0.3s 탭바 + 스플래시 종료와 동시(≤0.3s)', cf>=200 and sh>0 and rv>0 and 0<=rv-sh<=0.3, f'cobalt={cf} splashHide={sh}s reveal={rv}s')
          c8,l8=band(S('01_home_8s')); c15,l15=band(S('01_home_15s')); item(2,'홈 8·15초 로드+탭바', c8>=200 and c15>=200, f'cobalt 8s={c8} 15s={c15}')
          tabs=['cat','score','home','sched','my']; lt={k:band(S(f'02_light_{k}')) for k in tabs}; dk={k:band(S(f'02_dark_{k}')) for k in tabs}
          item(3,'5탭 전환 캡처(라이트)', all(lt[k][0]>=200 for k in tabs), ' '.join(f'{k}={lt[k][0]}' for k in tabs))
          item(4,'라이트 5탭 탭바 휘도 모두 >128', all(lt[k][1]>128 for k in tabs), f'lum {[lt[k][1] for k in tabs]}')
          item(5,'다크 설정에서도 5탭 휘도 >128(라이트 전용) + 탭바 표시', all(dk[k][1]>128 and dk[k][0]>=100 for k in tabs), f'lum {[dk[k][1] for k in tabs]} cobalt {[dk[k][0] for k in tabs]}')
          navs={}
          for k in tabs:
              try: navs[k]=json.load(open(f'smoke/smoke_{k}.json'))
              except Exception: navs[k]=None
          item(6,'웹 하단탭 비노출(5탭)', all(navs[k] and navs[k].get('nav')=='none' for k in tabs), ' '.join(f"{k}={navs[k].get('nav') if navs[k] else 'nojson'}" for k in tabs))
          alive=os.path.exists('smoke/launchctl.txt') and 'com.campusdoit.app' in open('smoke/launchctl.txt').read(); item(7,'프로세스 생존', alive, 'launchctl list')
          co,lo=band(S('05_offline_home')); item(8,'오프라인 실행(번들 웹) 홈+탭바', co>=200, f'cobalt={co}')
          try: g=json.load(open('smoke/smoke_score.json')); v=g.get('view'); ge=g.get('err',''); gl=g.get('logged')
          except Exception: v='nojson'; ge=''; gl=None
          cg,_=band(S('04_login_gate')); item(9,'로그인 게이트(점수진단 실행→loginView)', v=='loginView', f'view={v} logged={gl} err={ge}')
          try: L=json.load(open('smoke/smoke_home.json')).get('layout') or {}; a=L.get('2') or {}; b8=L.get('8') or {}
          except Exception: a=b8={}
          ok10=bool(a) and bool(b8) and a.get('job') is not None and a.get('job')==b8.get('job') and a.get('cards')==b8.get('cards') and a.get('bnH')==b8.get('bnH')
          item(10,'홈 레이아웃 이동 0 (2s↔8s: 카드·배너 높이·직업 카드 위치)', ok10, f'2s={a} 8s={b8}')
          try: T=json.load(open('smoke/smoke_my.json')); ts=T.get('ts') or {}; tv=T.get('view')
          except Exception: ts={}; tv='nojson'
          item(11,'iOS Turnstile 면제: 가입 화면 진입 + 위젯 미렌더 + 앱 헤더 전송', tv=='signupView' and ts.get('iframes',0)==0 and ts.get('exempt',0)>=1 and ts.get('hdr')==True, f'view={tv} {ts}')
          try: A=T.get('api') or {}
          except Exception: A={}
          okA=A.get('status')==200 and '"available": false' in (A.get('body','').replace(' ','').replace('"available":false','"available": false'))
          item(12,'네이티브 auth/check 도달(200 + available=false, test111)', okA, f'{A}')
          try: AD=json.load(open('smoke/smoke_ads.json')).get('ads') or {}
          except Exception: AD={}
          st=AD.get('status') or {}; rw=AD.get('rewarded') or {}; na=AD.get('native') or {}; cd=AD.get('card') or {}
          item(13,'ATT 상태 기록(권한 팝업 문구 Info.plist 등록)', st.get('att') in ('notDetermined','authorized','denied','restricted'), f"att={st.get('att')} unit={st.get('rewardedUnit')}")
          item(14,'보상형 광고 로드(테스트 단위, dryRun)', rw.get('loaded')==True, f'{rw}')
          item(15,'네이티브 광고 카드 로드(테스트 단위)', na.get('loaded')==True, f'{na}')
          item(16,'열쇠 0 카드 DOM(블러+닫기·광고 보고 결과 열기)', cd.get('blur')==True and any(('광고' in b) or ('ad' in b.lower()) for b in cd.get('btns',[])), f'{cd}')
          ok=all(r[2] for r in R)
          def _ann(t,x): print("::notice title="+t+"::"+str(x).replace("%","%25").replace("\r","").replace("\n","%0A")[:3800])
          for i in range(0,len(R),8): _ann(f"smoke-{R[i][0]}-{R[min(i+7,len(R)-1)][0]}", "\n".join(f'{n} {"PASS" if o else "FAIL"} {nm} | {d}' for n,nm,o,d in R[i:i+8]))
          import glob as _g
          for f in (sorted(_g.glob("smoke/*.json"))+sorted(_g.glob("smoke/*.txt")))[:7]: _ann("json-"+os.path.basename(f), open(f).read()[:3800])
          md='| # | 항목 | 결과 | 수치 |\n|---|---|---|---|\n'+'\n'.join(f'| {n} | {nm} | {"✅ PASS" if o else "❌ FAIL"} | {d} |' for n,nm,o,d in R)+f'\n\n**{"SMOKE_OK" if ok else "SMOKE_FAIL"}**\n'
          open(os.environ.get('GITHUB_STEP_SUMMARY','/dev/stdout'),'a').write('## iOS 셸 스모크 16항\n'+md); print(md); sys.exit(0 if ok else 1)
          PY
      - name: Import distribution certificate
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'false' }}
        run: |
          echo "$IOS_CERT_P12_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p ci $RUNNER_TEMP/build.keychain
          security set-keychain-settings -lut 21600 $RUNNER_TEMP/build.keychain
          security default-keychain -s $RUNNER_TEMP/build.keychain
          security unlock-keychain -p ci $RUNNER_TEMP/build.keychain
          security import $RUNNER_TEMP/cert.p12 -k $RUNNER_TEMP/build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci $RUNNER_TEMP/build.keychain
          security list-keychains -d user -s $RUNNER_TEMP/build.keychain login.keychain-db
      - name: Write App Store Connect API key
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'false' }}
        run: echo "$ASC_KEY_P8_B64" | base64 --decode > $RUNNER_TEMP/AuthKey.p8
      - name: Build & upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'false' }}
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain
        run: bundle exec fastlane ios beta || (gem install fastlane -N -v 2.222.0 && fastlane ios beta)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Logs/fastlane
          if-no-files-found: ignore
