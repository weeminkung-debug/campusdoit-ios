name: iOS TestFlight
on:
  push: { tags: ['ios-v*'] }
  workflow_dispatch: {}
concurrency: { group: ios-build, cancel-in-progress: true }
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_DISABLE_COLORS: "1"
      CI: "true"
      TEAM_ID: "885CWQ465B"
      APP_ID: "com.campusdoit.app"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      IOS_CERT_P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add & sync iOS
        run: |
          test -d ios || npx cap add ios
          npx cap sync ios
      - name: Native tab bar shell (plugin overlay) + splash assets
        run: |
          set -euo pipefail
          cp native/App/NativeTabsPlugin.swift ios/App/App/
          gem install xcodeproj -N
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" } or abort("App target not found")
            group = proj.main_group.groups.find { |g| g.path == "App" || g.name == "App" } or abort("App group not found")
            f = "NativeTabsPlugin.swift"
            unless group.files.any? { |x| x.path == f }
              ref = group.new_reference(f)
              target.source_build_phase.add_file_reference(ref, true)
            end
            proj.save
          '
          ruby native/App/register_plugin.rb
          grep -c "NativeTabsPlugin.swift" ios/App/App.xcodeproj/project.pbxproj
          for f in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do cp resources/splash-2732x2732.png "ios/App/App/Assets.xcassets/Splash.imageset/$f"; done
          ls ios/App/App/Assets.xcassets/Splash.imageset/
      - name: App icon 1024 into Assets
        run: cp resources/AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Export compliance (exempt) into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" ios/App/App/Info.plist
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-cache-${{ hashFiles('ios/App/Podfile') }}
          restore-keys: cocoapods-cache-
      - name: pod install (Podfile.lock ↔ Manifest.lock 동기)
        run: |
          cd ios/App
          pod install --repo-update
          diff Podfile.lock Pods/Manifest.lock && echo "Pods in sync"
      - name: Simulator smoke (build → launch → screenshots → alive check)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);c=[x for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")];c.sort(key=lambda x:x["name"]);print(c[-1]["udid"])')
          echo "sim=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -20
          APP=$(find build/sim -name "App.app" -path "*iphonesimulator*" | head -1); echo "app=$APP"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p smoke
          xcrun simctl launch "$UDID" com.campusdoit.app; sleep 8
          xcrun simctl io "$UDID" screenshot smoke/01_home.png
          xcrun simctl terminate "$UDID" com.campusdoit.app || true
          xcrun simctl launch "$UDID" com.campusdoit.app -smokeTab sched; sleep 9
          xcrun simctl io "$UDID" screenshot smoke/02_sched_tab.png
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "com.campusdoit.app"; then echo "ALIVE"; else echo "PROCESS DEAD"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: smoke/*.png
      - name: Import distribution certificate
        run: |
          echo "$IOS_CERT_P12_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p ci $RUNNER_TEMP/build.keychain
          security set-keychain-settings -lut 21600 $RUNNER_TEMP/build.keychain
          security default-keychain -s $RUNNER_TEMP/build.keychain
          security unlock-keychain -p ci $RUNNER_TEMP/build.keychain
          security import $RUNNER_TEMP/cert.p12 -k $RUNNER_TEMP/build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci $RUNNER_TEMP/build.keychain
          security list-keychains -d user -s $RUNNER_TEMP/build.keychain login.keychain-db
      - name: Write App Store Connect API key
        run: echo "$ASC_KEY_P8_B64" | base64 --decode > $RUNNER_TEMP/AuthKey.p8
      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain
        run: bundle exec fastlane ios beta || (gem install fastlane -N -v 2.222.0 && fastlane ios beta)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Logs/fastlane
          if-no-files-found: ignore
