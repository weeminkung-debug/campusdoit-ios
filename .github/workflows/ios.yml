name: iOS TestFlight
on:
  push: { tags: ['ios-v*'] }
  workflow_dispatch: {}
concurrency: { group: ios-build, cancel-in-progress: true }
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      IOS_CERT_P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ios-${{ runner.os }}-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: ios-${{ runner.os }}-
      - run: test -d ios || npx cap add ios
      - run: npx cap sync ios
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Import signing cert
        run: |
          echo "$IOS_CERT_P12_B64" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: ASC API key
        run: echo "$ASC_KEY_P8_B64" | base64 --decode > AuthKey.p8
      - name: Copy fastlane into ios/App
        run: |
          mkdir -p ios/App/fastlane
          cp fastlane/Fastfile ios/App/fastlane/
          cp fastlane/Appfile ios/App/fastlane/ || true
      - name: Set development team
        run: |
          cd ios/App
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.campusdoit.app;/PRODUCT_BUNDLE_IDENTIFIER =
